services:
  bingo:
    image: ghcr.io/asiomchen/bingo-postgres:postgres17-bingo1.44.0
    shm_size: 1024mb
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${BINGO_SMOKE_PORT:-55432}:5432"

  rdkit:
    image: ghcr.io/asiomchen/rdkit-postgres:postgres17-rdkit2026.03.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${RDKIT_SMOKE_PORT:-55433}:5432"
