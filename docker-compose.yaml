
services:

  bingo:
    image: ghcr.io/asiomchen/bingo-postgres:postgres17-bingo1.44.0
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 1024mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    # volumes:
    #   - db_data:/var/lib/postgresql/data
  rdkit:
    image: ghcr.io/asiomchen/rdkit-postgres:postgres17-rdkit2026.03.4
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres



# volumes:
#   db_data:
